# Postiz main app on Fly — ghcr.io/gitroomhq/postiz-app:latest
# Deploy: infra/postiz/fly/deploy.sh (reads gitignored infra/postiz/.env.fly)
app = 'mos-postiz'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'performance-2x'
  memory = '4gb'
  processes = ['app']
